name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php-version }} / PostgreSQL 17)
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: ${{ secrets.DB_DATABASE }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - ${{ vars.DB_PORT }}:5432
        options: >-
          --health-cmd "pg_isready -U \$POSTGRES_USER -d \$POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: ${{ vars.DB_CONNECTION }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}

      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check CI configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            DB_CONNECTION
            DB_HOST
            DB_PORT
            DB_DATABASE
            DB_USERNAME
            DB_PASSWORD
          )

          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required CI value: ${variable}"
              exit 1
            fi
          done

          if [[ "$DB_CONNECTION" != "pgsql" ]]; then
            echo "::error::DB_CONNECTION must be pgsql."
            exit 1
          fi

          if [[ "$DB_HOST" != "127.0.0.1" && "$DB_HOST" != "localhost" ]]; then
            echo "::error::DB_HOST must target the local CI service."
            exit 1
          fi

          if [[ "$DB_PORT" != 5432 ]]; then
            echo "::error::DB_PORT must be 5432 in CI."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel
        shell: bash
        run: |
          set -euo pipefail

          cp .env.example .env

          mkdir -p \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            bootstrap/cache

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: >-
          composer install
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run database migrations
        run: php artisan migrate:fresh --force

      - name: Verify PostgreSQL connection
        shell: bash
        run: |
          set -euo pipefail

          php -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app
              ->make(Illuminate\Contracts\Console\Kernel::class)
              ->bootstrap();

          $driver = Illuminate\Support\Facades\DB::connection()
              ->getDriverName();

          if ($driver !== "pgsql") {
              fwrite(
                  STDERR,
                  "Expected pgsql, got ".$driver.PHP_EOL
              );

              exit(1);
          }

          echo "Tests use PostgreSQL.".PHP_EOL;
          '

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18'
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Lint TypeScript
        run: yarn lint

      - name: Check frontend formatting
        run: yarn format:check

      - name: Build frontend assets
        run: yarn build

  master-security:
    name: Dependency audit
    if: >-
      github.ref == 'refs/heads/master' ||
      github.base_ref == 'master'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18'
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Audit JavaScript dependencies
        run: yarn npm audit --all --recursive --severity high
