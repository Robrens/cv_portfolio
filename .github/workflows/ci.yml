name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.5 / PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: ${{ secrets.DB_DATABASE }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_portfolio -d cv_portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ vars.DB_CONNECTION }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache/data,sessions,views} bootstrap/cache

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run database migrations
        run: php artisan migrate:fresh --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18'
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Lint TypeScript
        run: yarn eslint resources/js --max-warnings=0

      - name: Check frontend formatting
        run: yarn prettier resources --check

      - name: Build frontend assets
        run: yarn build

  master-security:
    name: Dependency audit
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18'
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Audit JavaScript dependencies
        run: yarn npm audit --all --recursive --severity high